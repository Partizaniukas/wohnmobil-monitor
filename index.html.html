<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wohnmobil Batterie</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin-top: 40px;
    }

    .card {
      background: #222;
      margin: 20px auto;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      font-size: 2em;
    }

    .status {
      background: #222;
      margin: 20px auto;
      padding: 20px;
      border-radius: 20px;
      width: 320px;
      font-size: 1.1em;
      line-height: 1.8;
    }

    .online {
      color: #00ff88;
    }

    .offline {
      color: #ff4444;
    }
  </style>
</head>

<body>

  <h1>Wohnmobil Monitor</h1>

  <div class="card">
    🔋 <span id="voltage">--</span> V
  </div>

  <div class="card">
    🌡 <span id="temperature">--</span> °C
  </div>

  <div class="status">
    MQTT: <span id="mqttStatus" class="offline">getrennt</span><br>
    ESP32: <span id="espStatus" class="offline">offline</span><br>
    Letzte Daten: <span id="lastUpdate">--</span>
  </div>

  <script>
    let lastMessageTime = 0;

    const client = mqtt.connect(
      'wss://a7da96d4c631420a8eae1de3e32c451d.s1.eu.hivemq.cloud:8884/mqtt',
      {
        username: 'esp32',
        password: 'Guminis32',
        reconnectPeriod: 3000,
        connectTimeout: 10000
      }
    );

    client.on('connect', () => {
      document.getElementById('mqttStatus').innerText = 'verbunden';
      document.getElementById('mqttStatus').className = 'online';

      client.subscribe('wohnmobil/batterie1/data');
    });

    client.on('close', () => {
      document.getElementById('mqttStatus').innerText = 'getrennt';
      document.getElementById('mqttStatus').className = 'offline';
    });

    client.on('error', (err) => {
      console.log('MQTT Fehler:', err);
      document.getElementById('mqttStatus').innerText = 'Fehler';
      document.getElementById('mqttStatus').className = 'offline';
    });

    client.on('message', (topic, message) => {
      const data = JSON.parse(message.toString());

      document.getElementById('voltage').innerText =
        data.voltage.toFixed(2);

      document.getElementById('temperature').innerText =
        data.temperature.toFixed(1);

      lastMessageTime = Date.now();

      const now = new Date();
      document.getElementById('lastUpdate').innerText =
        now.toLocaleTimeString('de-DE');

      document.getElementById('espStatus').innerText = 'online';
      document.getElementById('espStatus').className = 'online';
    });

    setInterval(() => {
      if (lastMessageTime === 0) return;

      const secondsSinceLastMessage = (Date.now() - lastMessageTime) / 1000;

      if (secondsSinceLastMessage > 15) {
        document.getElementById('espStatus').innerText = 'offline';
        document.getElementById('espStatus').className = 'offline';
      } else {
        document.getElementById('espStatus').innerText = 'online';
        document.getElementById('espStatus').className = 'online';
      }
    }, 1000);
  </script>

</body>
</html>
