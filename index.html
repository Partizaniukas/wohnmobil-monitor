<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wohnmobil Monitor</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .status {
      background: #222;
      margin: 10px auto 25px auto;
      padding: 15px;
      border-radius: 16px;
      max-width: 420px;
      font-size: 1.1em;
    }

    .online {
      color: #00ff88;
    }

    .offline {
      color: #ff4444;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #222;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
    }

    .device {
      font-size: 1.1em;
      margin-bottom: 15px;
      color: #cccccc;
      word-break: break-word;
    }

    .value {
      font-size: 2em;
      margin: 12px 0;
    }

    .time {
      font-size: 0.9em;
      color: #aaaaaa;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <h1>Wohnmobil Monitor</h1>

  <div class="status">
    MQTT: <span id="mqttStatus" class="offline">getrennt</span><br>
    Geräte online: <span id="onlineCount">0</span>
  </div>

  <div id="devices" class="grid"></div>

  <script>
    const devices = {};
    const offlineAfterSeconds = 15;

    const client = mqtt.connect(
      'wss://a7da96d4c631420a8eae1de3e32c451d.s1.eu.hivemq.cloud:8884/mqtt',
      {
        username: 'esp32',
        password: 'Guminis32',
        reconnectPeriod: 3000,
        connectTimeout: 10000
      }
    );

    client.on('connect', () => {
      document.getElementById('mqttStatus').innerText = 'verbunden';
      document.getElementById('mqttStatus').className = 'online';

      client.subscribe('wohnmobil/+/data');
    });

    client.on('close', () => {
      document.getElementById('mqttStatus').innerText = 'getrennt';
      document.getElementById('mqttStatus').className = 'offline';
    });

    client.on('error', (err) => {
      console.log('MQTT Fehler:', err);
      document.getElementById('mqttStatus').innerText = 'Fehler';
      document.getElementById('mqttStatus').className = 'offline';
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        const deviceId = data.device || topic.split('/')[1];

        devices[deviceId] = {
          voltage: Number(data.voltage),
          temperature: Number(data.temperature),
          lastSeen: Date.now()
        };

        renderDevices();
      } catch (e) {
        console.log('JSON Fehler:', e);
      }
    });

    function renderDevices() {
      const container = document.getElementById('devices');
      container.innerHTML = '';

      let onlineCount = 0;

      Object.keys(devices).sort().forEach(deviceId => {
        const d = devices[deviceId];
        const seconds = (Date.now() - d.lastSeen) / 1000;
        const online = seconds <= offlineAfterSeconds;

        if (online) onlineCount++;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="device">${deviceId}</div>
          <div class="value">🔋 ${d.voltage.toFixed(2)} V</div>
          <div class="value">🌡 ${d.temperature.toFixed(1)} °C</div>
          <div>Status: <span class="${online ? 'online' : 'offline'}">${online ? 'online' : 'offline'}</span></div>
          <div class="time">Letzte Daten: ${new Date(d.lastSeen).toLocaleTimeString('de-DE')}</div>
        `;

        container.appendChild(card);
      });

      document.getElementById('onlineCount').innerText = onlineCount;
    }

    setInterval(renderDevices, 1000);
  </script>

</body>
</html>
