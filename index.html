<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wohnmobil Monitor</title>

  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .status, .card {
      background: #222;
      border-radius: 20px;
      padding: 20px;
    }

    .status {
      max-width: 420px;
      margin: 10px auto 25px auto;
      font-size: 1.1em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .device {
      font-size: 1.1em;
      color: #ccc;
      word-break: break-word;
      margin-bottom: 15px;
    }

    .value {
      font-size: 2em;
      margin: 12px 0;
    }

    .online { color: #00ff88; }
    .offline { color: #ff4444; }

    .time {
      font-size: 0.9em;
      color: #aaa;
      margin-top: 12px;
    }

    .wifi {
      margin-top: 12px;
      font-size: 1em;
    }

    .bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
      margin-left: 8px;
      margin-right: 8px;
    }

    .bar {
      width: 6px;
      background: #444;
      border-radius: 3px;
    }

    .bar:nth-child(1) { height: 6px; }
    .bar:nth-child(2) { height: 10px; }
    .bar:nth-child(3) { height: 14px; }
    .bar:nth-child(4) { height: 18px; }

    .bar.active.good { background: #00ff88; }
    .bar.active.medium { background: #ffaa00; }
    .bar.active.bad { background: #ff4444; }
  </style>
</head>

<body>

  <h1>Wohnmobil Monitor</h1>

  <div class="status">
    MQTT: <span id="mqttStatus" class="offline">getrennt</span><br>
    Geräte online: <span id="onlineCount">0</span>
  </div>

  <div id="devices" class="grid"></div>

  <script>
    const devices = {};
    const offlineAfterSeconds = 15;

    const client = mqtt.connect(
      'wss://a7da96d4c631420a8eae1de3e32c451d.s1.eu.hivemq.cloud:8884/mqtt',
      {
        username: 'esp32',
        password: 'Guminis32',
        reconnectPeriod: 3000,
        connectTimeout: 10000
      }
    );

    client.on('connect', () => {
      document.getElementById('mqttStatus').innerText = 'verbunden';
      document.getElementById('mqttStatus').className = 'online';
      client.subscribe('wohnmobil/+/data');
    });

    client.on('close', () => {
      document.getElementById('mqttStatus').innerText = 'getrennt';
      document.getElementById('mqttStatus').className = 'offline';
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        const deviceId = data.device || topic.split('/')[1];

        devices[deviceId] = {
          voltage: Number(data.voltage),
          temperature: Number(data.temperature),
          wifi_rssi: Number(data.wifi_rssi),
          lastSeen: Date.now()
        };

        renderDevices();
      } catch (e) {
        console.log('JSON Fehler:', e);
      }
    });

 function wifiBars(rssi) {

  let bars = 1;
  let quality = 'bad';

  // Sehr gut
  if (rssi >= -60) {
    bars = 4;
    quality = 'good';
  }

  // Gut
  else if (rssi >= -70) {
    bars = 3;
    quality = 'good';
  }

  // Okay
  else if (rssi >= -80) {
    bars = 2;
    quality = 'medium';
  }

  // Schlecht
  else {
    bars = 1;
    quality = 'bad';
  }

      let html = '<span class="bars">';
      for (let i = 1; i <= 4; i++) {
        html += `<span class="bar ${i <= bars ? 'active ' + quality : ''}"></span>`;
      }
      html += '</span>';

      return html;
    }

    function renderDevices() {
      const container = document.getElementById('devices');
      container.innerHTML = '';

      let onlineCount = 0;

      Object.keys(devices).sort().forEach(deviceId => {
        const d = devices[deviceId];
        const seconds = (Date.now() - d.lastSeen) / 1000;
        const online = seconds <= offlineAfterSeconds;

        if (online) onlineCount++;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="device">${deviceId}</div>
          <div class="value">🔋 ${d.voltage.toFixed(2)} V</div>
          <div class="value">🌡 ${d.temperature.toFixed(1)} °C</div>

          <div class="wifi">
            WLAN ${wifiBars(d.wifi_rssi)} ${d.wifi_rssi} dBm
          </div>

          <div>Status:
            <span class="${online ? 'online' : 'offline'}">
              ${online ? 'online' : 'offline'}
            </span>
          </div>

          <div class="time">
            Letzte Daten: ${new Date(d.lastSeen).toLocaleTimeString('de-DE')}
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById('onlineCount').innerText = onlineCount;
    }

    setInterval(renderDevices, 1000);
  </script>

</body>
</html>
